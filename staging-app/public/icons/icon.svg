<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160829"/>
      <stop offset="40%" stop-color="#0d041a"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>

    <!-- Neon Bunny Gradients -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b9a"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff70ba"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#nightSky)"/>
  
  <!-- Outer Neon Border Ring -->
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#neonPink)" stroke-width="4" stroke-opacity="0.6" filter="url(#softGlow)"/>

  <!-- Subtle Cyber Grid / Radial Pulse -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="6 8"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Ambient Light Halo behind Bunny -->
  <ellipse cx="256" cy="260" rx="130" ry="120" fill="#ec4899" opacity="0.18" filter="url(#pinkGlow)"/>

  <!-- ============================================== -->
  <!-- NIGHTLIFE BUNNY SILHOUETTE & NEON OUTLINE     -->
  <!-- ============================================== -->
  <g id="nightlifeBunny">
    <!-- LEFT EAR (Slightly tilted outward) -->
    <!-- Outer Glow Silhouette -->
    <path d="M 188 230 C 160 170 140 100 175 42 C 196 10 220 22 226 78 C 234 140 224 195 212 232 Z" 
          fill="#1c072e" 
          stroke="url(#neonPink)" 
          stroke-width="7" 
          filter="url(#pinkGlow)"/>
    <!-- Inner Ear Neon Core -->
    <path d="M 188 190 C 172 145 160 95 182 52 C 195 32 208 40 212 78 C 217 122 210 165 202 192 Z" 
          fill="url(#earInner)" 
          opacity="0.85"/>

    <!-- RIGHT EAR (Playful club-tilt / folded perk) -->
    <!-- Outer Glow Silhouette -->
    <path d="M 300 232 C 288 195 278 140 286 78 C 292 22 316 10 337 42 C 372 100 352 170 324 230 Z" 
          fill="#1c072e" 
          stroke="url(#neonPink)" 
          stroke-width="7" 
          filter="url(#pinkGlow)"/>
    <!-- Inner Ear Neon Core -->
    <path d="M 310 192 C 302 165 295 122 300 78 C 304 40 317 32 330 52 C 352 95 340 145 324 190 Z" 
          fill="url(#earInner)" 
          opacity="0.85"/>

    <!-- BUNNY HEAD SILHOUETTE -->
    <ellipse cx="256" cy="275" rx="88" ry="80" 
             fill="#140524" 
             stroke="url(#neonPink)" 
             stroke-width="7" 
             filter="url(#pinkGlow)"/>

    <!-- CHEEK WHISKER NEON TICKS -->
    <line x1="140" y1="270" x2="110" y2="265" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
    <line x1="142" y1="288" x2="116" y2="292" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>

    <line x1="372" y1="270" x2="402" y2="265" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
    <line x1="370" y1="288" x2="396" y2="292" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>

    <!-- NOSE & MOUTH (Sleek Neon Heart / Triangle) -->
    <polygon points="256,285 247,274 265,274" fill="#ff70ba" filter="url(#softGlow)"/>
    <path d="M 256 287 L 256 295 M 256 295 C 248 298 242 303 242 308 M 256 295 C 264 298 270 303 270 308" 
          fill="none" 
          stroke="#ff70ba" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <!-- NIGHTLIFE VIP SUNGLASSES / SHADES (Cyber-Chic Nightclub Vibe) -->
    <!-- Left Lens -->
    <polygon points="185,248 242,248 238,272 195,272" fill="#090114" stroke="url(#neonCyan)" stroke-width="4" filter="url(#softGlow)"/>
    <!-- Right Lens -->
    <polygon points="270,248 327,248 317,272 274,272" fill="#090114" stroke="url(#neonCyan)" stroke-width="4" filter="url(#softGlow)"/>
    <!-- Sunglasses Bridge -->
    <line x1="240" y1="254" x2="272" y2="254" stroke="url(#neonCyan)" stroke-width="4"/>
    <!-- Sunglasses Neon Glare Lines -->
    <line x1="194" y1="254" x2="216" y2="266" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="279" y1="254" x2="301" y2="266" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- NIGHTCLUB VIP COLLAR & BOWTIE -->
    <!-- Collar Band -->
    <path d="M 220 348 C 238 356 274 356 292 348" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Neon Hot Pink Bowtie -->
    <!-- Left Wing -->
    <polygon points="256,368 214,352 214,384" fill="url(#neonPink)" stroke="#ffffff" stroke-width="2" filter="url(#softGlow)"/>
    <!-- Right Wing -->
    <polygon points="256,368 298,352 298,384" fill="url(#neonPink)" stroke="#ffffff" stroke-width="2" filter="url(#softGlow)"/>
    <!-- Center Knot (Gold Diamond) -->
    <circle cx="256" cy="368" r="9" fill="url(#goldAccent)" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- ============================================== -->
  <!-- BRAND TYPOGRAPHY: TRICKHOPPER                  -->
  <!-- ============================================== -->
  <text x="256" y="440" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Montserrat', 'Impact', sans-serif" 
        font-size="40" 
        font-weight="900" 
        letter-spacing="0.14em" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#softGlow)">
    TRICKHOPPER
  </text>

  <text x="256" y="468" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" 
        font-size="13" 
        font-weight="800" 
        letter-spacing="0.25em" 
        fill="#ff70ba" 
        text-anchor="middle">
    NIGHTLIFE BUNNY RIDES
  </text>
</svg>
